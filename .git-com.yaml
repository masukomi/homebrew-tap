code-section:
    after-string: '] '
    before-string: '['
    destination: title
    instructions: Which formula?
    modifiable: true
    options:
        - git-com
        - private_comments
        - days_progress
        - hey
        - rtest
        - oho
        - tap
        - cleandiff
    type: select
commit-title:
    destination: title
    placeholder: Commit Title
    type: text
commit-description:
    allow-empty: true
    destination: body
    instructions: Please describe your changes.
    type: multiline-text
